<!doctype html><meta charset=utf-8><title>Backend test page</title>
<body style="font:14px system-ui;background:#111;color:#eee;margin:20px">
<h3>Backend test page <small>(replace with the Stitch export)</small></h3>
<button onclick="post('/api/connect',{sensor:'SIM'})">Connect SIM</button>
<button onclick="post('/api/config',{rate_khz:4})">Rate 4 kHz</button>
<button onclick="post('/api/record/start')">Rec</button>
<button onclick="post('/api/record/stop')">Stop rec</button>
<button onclick="post('/api/disconnect')">Disconnect</button>
<pre id=s></pre><canvas id=c width=900 height=260 style="background:#000"></canvas>
<script>
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
const ys=[],c=document.getElementById('c').getContext('2d');
new WebSocket(`ws://${location.host}/ws/stream`).onmessage=e=>{
 const f=JSON.parse(e.data);ys.push(f.value);if(ys.length>450)ys.shift();
 document.getElementById('s').textContent=JSON.stringify(f,null,1);
 c.clearRect(0,0,900,260);c.strokeStyle='#e30613';c.beginPath();
 ys.forEach((y,i)=>{const py=260-(y-8000)/9000*260;i?c.lineTo(i*2,py):c.moveTo(0,py)});c.stroke();};
</script>
