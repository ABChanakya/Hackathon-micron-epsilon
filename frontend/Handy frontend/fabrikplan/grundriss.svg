<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 505">
<title>Fiktiver Fabrikplan</title>
<style>
.floor{fill:url(#tiles);stroke:#657e963d;stroke-width:11;stroke-linejoin:round}
.outer,.wall{fill:none;stroke-linejoin:miter;stroke-linecap:square}
.outer{stroke:#b0c1d1;stroke-width:4px;filter:drop-shadow(0 0 3px #9eb8d055)}
.wall{stroke:#768da0;stroke-width:2.6px}.corridor{fill:#263543}
.apron{fill:url(#hatch);stroke:#65798d;stroke-width:1}
.equipment{fill:#273747;stroke:#8395a6;stroke-width:1.35;stroke-linejoin:round}
.equipment use{filter:brightness(.77) saturate(.72)}
.door{fill:none;stroke:#9eafbf;stroke-width:1.2}.gate{stroke:#8fa4b7;stroke-width:1.8;fill:#394b5c}
.map-labels text{font:650 16px Geist,system-ui,sans-serif;letter-spacing:-.5px;fill:#e9edf1;paint-order:stroke;stroke:#151d26;stroke-width:4;stroke-linejoin:round}
.micro{font-size:11px;letter-spacing:1.4px;fill:#c1cfdb}.compass{text-anchor:middle;fill:#b6c8d9;font:600 12px monospace}
</style>
